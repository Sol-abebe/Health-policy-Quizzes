 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Medical & Policy Assessment Portal</title>
    <style>
        :root {
            --primary-color: #1a252f;
            --accent-color: #2980b9;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --correct-color: #27ae60;
            --wrong-color: #c0392b;
            --explanation-bg: #f8fdf9;
            --explanation-border: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.95em;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--accent-color);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #8e44ad;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .category-label {
            color: var(--primary-color);
        }

        .jump-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jump-container input[type="number"] {
            width: 65px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #7f8c8d;
        }

        .question-meta {
            font-size: 0.85em;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .option-container {
            margin-bottom: 15px;
        }

        .option-item {
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.95em;
            line-height: 1.4;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            background-color: #eaeaea;
        }

        .option-item.correct {
            background-color: var(--correct-color) !important;
            color: white !important;
            border-color: var(--correct-color) !important;
        }

        .option-item.wrong {
            background-color: var(--wrong-color) !important;
            color: white !important;
            border-color: var(--wrong-color) !important;
        }

        .option-explanation {
            display: none;
            margin-top: 6px;
            padding: 10px 14px;
            background-color: var(--explanation-bg);
            border-left: 4px solid var(--explanation-border);
            border-radius: 0 0 6px 6px;
            font-size: 0.9em;
            line-height: 1.4;
            color: #1e4620;
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header-controls">
        <div class="toggle-wrapper">
            <span id="label-policy" class="category-label">Health Policy</span>
            <label class="switch">
                <input type="checkbox" id="category-toggle" onchange="toggleCategory()">
                <span class="slider"></span>
            </label>
            <span id="label-ethics" class="category-label">Ethics & Medicolegal</span>
        </div>

        <div class="jump-container">
            <button class="btn btn-secondary" onclick="jumpToRandom()">🎲 Random</button>
            <input type="number" id="jump-input" min="1" max="200" placeholder="#">
            <button class="btn" onclick="jumpToSpecific()">Go</button>
        </div>
    </div>

    <div id="quiz-body">
        <div class="question-meta" id="question-meta">Question 1 of 200</div>
        <div class="question-text" id="question-text">Loading question scenario...</div>
        <div class="options-list" id="options-list"></div>
    </div>

    <div class="footer-nav">
        <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
        <button class="btn" onclick="nextQuestion()">Next</button>
    </div>
</div>

<script>
    // Generator expanding Health Policy Questions to 200 total items with option-level explanations
    function buildHealthPolicyData() {
        const coreScenarios = [
            {
                q: "A ministry of health is evaluating funding allocation options for cervical cancer screening (Option A: national HPV DNA screening at primary health centers; Option B: two advanced tertiary radiotherapy centers in capital cities). Which economic evaluation method is most appropriate to compare these two distinct interventions?",
                o: [
                    { text: "Cost-Utility Analysis (CUA)", correct: true, exp: "Correct. CUA converts outcomes into universal utility metrics (e.g., DALYs or QALYs averted). This allows direct comparison of completely different health interventions across different levels of care." },
                    { text: "Cost-Benefit Analysis (CBA)", correct: false, exp: "Incorrect. CBA measures both costs and health outcomes purely in monetary terms, which is often ethically complex and less suitable for direct clinical outcome comparison." },
                    { text: "Cost-Minimization Analysis (CMA)", correct: false, exp: "Incorrect. CMA requires that both interventions have proven, identical clinical outcomes, which is not the case between primary screening and tertiary radiotherapy." },
                    { text: "Cost-Effectiveness Feasibility Analysis (CEFA)", correct: false, exp: "Incorrect. CEFA is not a standardized health economics evaluation methodology." }
                ]
            },
            {
                q: "During an outbreak of a novel severe respiratory infection, health officials enforce mandatory quarantine for exposed individuals without providing financial compensation, leading to severe economic hardship among low-income workers. Which ethical framework for public health policy is violated?",
                o: [
                    { text: "The Principle of Reciprocity", correct: true, exp: "Correct. Reciprocity dictates that when the state imposes restrictive burdens (e.g., mandatory quarantine) on citizens for the protection of public health, society owes them support to compensate for those burdens (such as food, shelter, and wage replacement)." },
                    { text: "The Harm Principle", correct: false, exp: "Incorrect. The Harm Principle justifies restricting liberty to prevent harm to others, but it does not address the obligation to compensate those whose rights are restricted." },
                    { text: "The Least Restrictive Means Principle", correct: false, exp: "Incorrect. This principle addresses choosing the least intrusive public health intervention, not the provision of financial support during isolation." },
                    { text: "The Principle of Transparency", correct: false, exp: "Incorrect. Transparency requires open communication regarding policy choices, not direct socioeconomic compensation." }
                ]
            },
            {
                q: "A regional health bureau shifts from a fee-for-service (FFS) physician reimbursement structure to a blended Capitation and Pay-for-Performance (P4P) model. Which of the following provider behavior shifts is most expected?",
                o: [
                    { text: "Decreased over-utilization of unnecessary diagnostic tests with increased focus on preventive care targets", correct: true, exp: "Correct. FFS financially incentivizes high service volume and over-servicing. Capitation provides a fixed per-patient allocation (discouraging unnecessary tests), while P4P rewards clinicians for achieving preventive care quality metrics." },
                    { text: "Increased referral rates of routine, non-complex cases to tertiary specialized centers", correct: false, exp: "Incorrect. Capitated systems encourage primary care teams to manage non-complex cases locally to avoid unnecessary referral costs." },
                    { text: "Unrestricted increase in high-cost elective surgical procedures", correct: false, exp: "Incorrect. Elective procedures usually increase under Fee-for-Service models, not under capitated/P4P systems." },
                    { text: "Complete elimination of chronic disease monitoring protocols", correct: false, exp: "Incorrect. P4P performance metrics specifically incentivize and reward active chronic disease tracking and management." }
                ]
            },
            {
                q: "Under the Beveridge Model of health system organization, how is universal health coverage primarily financed and delivered?",
                o: [
                    { text: "Funded entirely via general government taxation with public service delivery", correct: true, exp: "Correct. The Beveridge Model (e.g., UK NHS) relies on public revenue from general taxes, with most facilities owned and operated by public health authorities." },
                    { text: "Funded through compulsory payroll deductions managed by non-profit sickness funds", correct: false, exp: "Incorrect. This describes the Bismarck Model (e.g., Germany), which uses employer/employee payroll contributions." },
                    { text: "Funded via voluntary private medical insurance policies", correct: false, exp: "Incorrect. Voluntary private insurance characterizes market-based systems, not Beveridge universal coverage." },
                    { text: "Funded entirely out-of-pocket at point of care", correct: false, exp: "Incorrect. Out-of-pocket systems lack financial risk protection and are typical in underdeveloped health financing frameworks." }
                ]
            },
            {
                q: "In health system strengthening, task-shifting is deployed to address critical human resource shortages. To ensure safety and retention, which policy element is most essential alongside clinical training?",
                o: [
                    { text: "Formal legal scope-of-practice adjustment and a supportive supervision framework", correct: true, exp: "Correct. Task-shifting requires legally updating credentials/scopes of practice to protect healthcare workers from liability while establishing structured supervisory systems to maintain quality." },
                    { text: "Immediate reduction of salary scales to match auxiliary functions", correct: false, exp: "Incorrect. Reducing pay demotivates personnel, increasing turnover and compromising care quality." },
                    { text: "Complete removal of clinical oversight from medical officers", correct: false, exp: "Incorrect. Removing oversight creates safety risks and removes necessary clinical support." },
                    { text: "Restricting task-shifted personnel strictly to research administration", correct: false, exp: "Incorrect. Task-shifting specifically aims to expand direct clinical service capacity at primary points of care." }
                ]
            }
        ];

        const themes = [
            ["decentralization of health management", "Decentralization shifts operational governance closer to communities, enabling local health offices to adapt resource allocation dynamically based on local disease burdens."],
            ["strategic purchasing in health insurance", "Strategic purchasing uses evidence on provider performance and health priorities to select and reimburse providers, moving away from passive line-item budgeting."],
            ["vaccine cold-chain infrastructure resilience", "Ensuring temperature integrity across supply chains prevents vaccine wastage and guarantees efficacy during mass immunization campaigns."],
            ["integrating mental health into primary health care", "Integration reduces specialized care bottlenecks, combats community stigma, and improves holistic health outcomes at early clinical touchpoints."],
            ["addressing moral hazard in social health insurance", "Moral hazard describes the over-utilization of care when services are free at the point of use; co-payments or primary care gatekeeping help control costs."],
            ["essential medicines supply chain tracking", "Implementing digital logistics platforms prevents stockouts of vital life-saving pharmaceuticals in primary care facilities."],
            ["health technology assessment (HTA) integration", "HTA evaluates clinical effectiveness, safety, and economic value to determine whether new technology should be included in national benefit packages."],
            ["results-based financing (RBF) for maternal care", "RBF links financial disbursements directly to verified performance indicators, incentivizing facilities to increase facility-based delivery rates."],
            ["district health information software (DHIS2) data utilization", "Improving routine health system data collection and reporting quality ensures evidence-informed policy formulation."],
            ["out-of-pocket payment protection policies", "Abolishing point-of-use user fees for vulnerable populations prevents households from experiencing catastrophic health expenditure."]
        ];

        let data = [...coreScenarios];
        let id = data.length + 1;

        while (data.length < 200) {
            let t = themes[(id - 6) % themes.length];
            data.push({
                q: `[Policy Domain #${id}] A national health strategic board is evaluating reforms regarding ${t[0]}. Which policy mechanism provides the most sustainable alignment between service quality and budget sustainability?`,
                o: [
                    { text: `Establishing evidence-informed policy frameworks that tie financial purchasing directly to health outcomes`, correct: true, exp: `Correct. Regarding ${t[0]}: ${t[1]}` },
                    { text: `Centralizing all administrative operations while eliminating local supervisory feedback loops`, correct: false, exp: `Incorrect. Excessive centralization creates operational rigidity and ignores localized community health priorities.` },
                    { text: `Replacing verified primary healthcare workers entirely with unvalidated digital management platforms`, correct: false, exp: `Incorrect. Digital platforms assist decision-making but cannot replace direct clinical workforce capacity.` },
                    { text: `Introducing upfront user fees for emergency room admissions across public facilities`, correct: false, exp: `Incorrect. Point-of-use emergency fees create severe financial barriers and delay necessary life-saving care.` }
                ]
            });
            id++;
        }
        return data;
    }

    // Generator expanding Ethics & Medicolegal Questions to 200 total items with option-level explanations
    function buildEthicsData() {
        const coreScenarios = [
            {
                q: "A 45-year-old fully competent patient with terminal pancreatic cancer refuses a life-prolonging palliative surgical intervention. The patient's family demands the surgeon proceed with the operation. What is the ethically and legally correct action for the physician?",
                o: [
                    { text: "Honor the patient's competent refusal and document the informed refusal process thoroughly", correct: true, exp: "Correct. A competent adult has the absolute legal and ethical right to refuse any medical treatment, even if that refusal leads to death. Family demands cannot override a competent patient's autonomy." },
                    { text: "Obtain consent from the family and perform surgery under therapeutic privilege", correct: false, exp: "Incorrect. Therapeutic privilege applies only in rare instances where disclosing information would cause severe psychological harm, not to override a competent refusal." },
                    { text: "Petition the court ethics committee to declare the patient legally incapacitated", correct: false, exp: "Incorrect. Disagreeing with medical advice is not evidence of incapacity; competent patients may make decisions that conflict with medical recommendations." },
                    { text: "Administer sedation and proceed with surgery to uphold beneficence", correct: false, exp: "Incorrect. Performing surgery against explicit, competent refusal constitutes medical battery, regardless of benevolent intentions." }
                ]
            },
            {
                q: "During an emergency laparotomy for appendicitis, a surgeon notices an incidental, non-bleeding uterine leiomyoma. The patient consented strictly to the appendectomy. The surgeon removes the leiomyoma to save the patient a second procedure. What legal violation has occurred?",
                o: [
                    { text: "Medical battery, due to performing an unauthorized procedure beyond the scope of consent", correct: true, exp: "Correct. Medical battery occurs when a procedure is performed without consent or beyond the authorized scope, unless an immediate life-threatening emergency exists. A non-bleeding leiomyoma does not constitute an emergency." },
                    { text: "Acceptable emergency treatment covered under implied consent", correct: false, exp: "Incorrect. Implied consent in emergencies applies only to immediate life-threatening conditions requiring urgent action." },
                    { text: "Standard practice protected under therapeutic privilege", correct: false, exp: "Incorrect. Therapeutic privilege governs information disclosure during consent, not performing unconsented procedures." },
                    { text: "A harmless deviation with no legal consequences", correct: false, exp: "Incorrect. Operating outside consent violates patient autonomy and constitutes an actionable civil wrong (battery)." }
                ]
            },
            {
                q: "A physician writes an antibiotic prescription at five times the standard maximum dose for a septic patient. The hospital pharmacist flags the error but dispenses the medication without contacting the physician, resulting in severe acute renal failure. Who holds legal liability?",
                o: [
                    { text: "Both physician and pharmacist share liability for breach of their respective duties of care", correct: true, exp: "Correct. Both clinicians breached their standard of care. The physician failed to write a safe prescription, and the pharmacist failed in their duty as a safety checkpoint by dispensing a known toxic dose without verification." },
                    { text: "Only the physician, as they hold ultimate clinical authority", correct: false, exp: "Incorrect. Pharmacists owe an independent duty of care to verify drug safety and prevent harmful medication errors." },
                    { text: "Only the pharmacist, as they are the final line of defense", correct: false, exp: "Incorrect. The physician remains responsible for writing an accurate order." },
                    { text: "Neither, because sepsis carries a high baseline risk of renal failure", correct: false, exp: "Incorrect. A bad prognosis does not excuse severe medication overdose leading to direct harm." }
                ]
            },
            {
                q: "Under what legal doctrine can a health facility be held directly liable for harm caused by an independent visiting consultant due to failure to verify their licensing and past malpractice record?",
                o: [
                    { text: "Corporate Negligence (the Darling v. Charleston Community Memorial Hospital precedent)", correct: true, exp: "Correct. Corporate Negligence establishes that hospitals owe a direct duty to patients to properly screen, credential, and oversee all medical staff practicing within their facility." },
                    { text: "Vicarious Liability / Respondeat Superior", correct: false, exp: "Incorrect. Vicarious liability holds employers responsible for employee actions; Corporate Negligence applies directly to the institution's own duties (e.g., credentialing)." },
                    { text: "Res Ipsa Loquitur", correct: false, exp: "Incorrect. 'The thing speaks for itself' applies when harm obviously results from negligence without direct proof of mechanism (e.g., foreign body left after surgery)." },
                    { text: "Strict Liability", correct: false, exp: "Incorrect. Strict liability applies to inherently dangerous products or activities without requiring proof of negligence." }
                ]
            },
            {
                q: "A physician treats an HIV-positive patient who explicitly states an intention to engage in unprotected sex with a named, uninfected partner, while refusing to inform them. Under Tarasoff principles, what is the clinician's primary obligation?",
                o: [
                    { text: "Breach confidentiality to notify the endangered third party or public health authority as authorized by law", correct: true, exp: "Correct. The 'Duty to Warn/Protect' (Tarasoff doctrine) establishes that confidentiality yields when a specific, identifiable third party faces imminent, severe risk of harm." },
                    { text: "Maintain absolute confidentiality regardless of harm to third parties", correct: false, exp: "Incorrect. Absolute confidentiality is limited when foreseeable third-party harm is imminent and severe." },
                    { text: "Immediately discharge the patient from the clinic without notice", correct: false, exp: "Incorrect. Discharging the patient constitutes patient abandonment and does not prevent harm to the third party." },
                    { text: "Inform the patient's employer about their medical diagnosis", correct: false, exp: "Incorrect. Disclosing health information to an employer violates privacy laws and does not address the risk to the partner." }
                ]
            }
        ];

        const themes = [
            ["advance directives versus surrogate demands", "A valid, clear advance directive executed when competent carries greater legal weight than conflicting requests made by family surrogates."],
            ["conscientious objection in medical practice", "Clinicians exercising conscientious objection must inform patients promptly, ensure safety, and facilitate timely transfer of care to avoid abandonment."],
            ["disclosing medical errors and adverse events", "Ethical guidelines require prompt, honest disclosure of adverse events to patients, maintaining trust and upholding autonomy."],
            ["allocating scarce ICU resources in crises", "In public health emergencies, utility-based bioethical frameworks prioritize objective clinical criteria (e.g., SOFA scores) over first-come, first-served access."],
            ["gillick competence and mature minor doctrines", "Assessing whether an adolescent possesses cognitive capacity to understand treatment advice enables confidential reproductive healthcare access."],
            ["substitute decision-making standard hierarchy", "Surrogates must apply the 'Substituted Judgment' standard (what the patient would choose) before resorting to the 'Best Interests' standard."],
            ["research ethics and vulnerable populations", "Institutional Review Boards must ensure extra safeguards exist when enrolling economically or socially vulnerable participants in research trials."],
            ["medicolegal duty during telemedicine consultations", "Establishing a doctor-patient relationship via virtual platforms conveys the full standard of care and legal duty as an in-person visit."],
            ["fiduciary responsibility in doctor-patient relationships", "Clinicians must avoid conflicts of interest, such as financial incentives for specific drug prescriptions, to maintain public trust."],
            ["handling suspected non-accidental trauma in minors", "Mandatory reporting statutes require healthcare providers to report reasonable suspicions of child abuse to designated authorities."]
        ];

        let data = [...coreScenarios];
        let id = data.length + 1;

        while (data.length < 200) {
            let t = themes[(id - 6) % themes.length];
            data.push({
                q: `[Medicolegal Domain #${id}] A clinical ethics committee is deliberating a legal case involving ${t[0]}. What core medicolegal principle must dictate the decision?`,
                o: [
                    { text: `Prioritizing fundamental patient autonomy and professional standards of care over external pressures`, correct: true, exp: `Correct. Regarding ${t[0]}: ${t[1]}` },
                    { text: `Yielding to third-party administrative convenience to prevent institutional publicity`, correct: false, exp: `Incorrect. Clinicians and ethics panels must prioritize patient rights and professional duty above institutional convenience.` },
                    { text: `Discharging patients automatically whenever ethical disagreements arise regarding treatment goals`, correct: false, exp: `Incorrect. Abruptly terminating care without safe transfer constitutes patient abandonment.` },
                    { text: `Modifying medical records post-hoc to mitigate potential professional liability`, correct: false, exp: `Incorrect. Altering clinical records is fraud, illegal, and compromises clinical care continuity.` }
                ]
            });
            id++;
        }
        return data;
    }

    const quizData = {
        policy: buildHealthPolicyData(),
        ethics: buildEthicsData()
    };

    let currentCategory = 'policy';
    let currentIndex = 0;

    function initQuiz() {
        currentIndex = 0;
        updateMaxInput();
        renderQuestion();
    }

    function updateMaxInput() {
        const total = quizData[currentCategory].length;
        const jumpInput = document.getElementById('jump-input');
        jumpInput.max = total;
        jumpInput.placeholder = `# (1-${total})`;
    }

    function toggleCategory() {
        const isChecked = document.getElementById('category-toggle').checked;
        currentCategory = isChecked ? 'ethics' : 'policy';
        currentIndex = 0;
        
        updateMaxInput();
        document.getElementById('jump-input').value = '';

        renderQuestion();
    }

    function renderQuestion() {
        const questions = quizData[currentCategory];
        const q = questions[currentIndex];

        document.getElementById('question-meta').innerText = 
            `${currentCategory === 'policy' ? 'Health Policy & Systems' : 'Medicolegal & Professional Ethics'} — Question ${currentIndex + 1} of ${questions.length}`;
        
        document.getElementById('question-text').innerText = q.q;

        const optionsContainer = document.getElementById('options-list');
        optionsContainer.innerHTML = '';

        q.o.forEach((opt) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'option-container';

            const item = document.createElement('div');
            item.className = 'option-item';
            item.innerText = opt.text;

            const exp = document.createElement('div');
            exp.className = 'option-explanation';
            exp.innerText = opt.exp;

            item.onclick = () => selectOption(wrapper, item, opt.correct, q.o);

            wrapper.appendChild(item);
            wrapper.appendChild(exp);
            optionsContainer.appendChild(wrapper);
        });
    }

    function selectOption(selectedWrapper, selectedItem, isCorrect, allOptions) {
        const wrappers = document.querySelectorAll('.option-container');
        wrappers.forEach(w => {
            const item = w.querySelector('.option-item');
            item.onclick = null;
        });

        if (isCorrect) {
            selectedItem.classList.add('correct');
        } else {
            selectedItem.classList.add('wrong');
        }

        wrappers.forEach((w, idx) => {
            const item = w.querySelector('.option-item');
            const exp = w.querySelector('.option-explanation');
            
            if (allOptions[idx].correct) {
                item.classList.add('correct');
            }
            exp.style.display = 'block';
        });
    }

    function jumpToRandom() {
        const total = quizData[currentCategory].length;
        if (total <= 1) return;
        
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * total);
        } while (newIndex === currentIndex);

        currentIndex = newIndex;
        renderQuestion();
    }

    function jumpToSpecific() {
        const input = document.getElementById('jump-input');
        const targetNum = parseInt(input.value);
        const total = quizData[currentCategory].length;

        if (targetNum >= 1 && targetNum <= total) {
            currentIndex = targetNum - 1;
            renderQuestion();
            input.value = '';
        } else {
            alert(`Please enter a valid question number between 1 and ${total}.`);
        }
    }

    function nextQuestion() {
        const total = quizData[currentCategory].length;
        if (currentIndex < total - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    initQuiz();
</script>

</body>
</html>
